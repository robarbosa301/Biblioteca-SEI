<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca Digital | SEI</title><style>:root{font-family:system-ui,Arial;color:#16324f}*{box-sizing:border-box}body{margin:0;background:#f3f7fb}header{background:#102d55;color:white;padding:28px 6vw}header h1{margin:0;font-size:clamp(26px,4vw,42px)}header p{margin:8px 0;color:#a8eaf7}.wrap{max-width:1100px;margin:0 auto;padding:28px 18px}.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.crumb button{border:0;background:transparent;color:#0879a4;text-decoration:underline;cursor:pointer;font-size:15px}h2{font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}.note{min-height:150px;padding:20px;border:0;border-radius:6px;box-shadow:3px 5px 12px #19324c23;cursor:pointer;text-align:left;color:#16324f;transition:transform .15s}.note:hover{transform:translateY(-5px)}.note strong{font-size:20px;display:block;margin:22px 0 6px}.note span{font-size:13px}.panel{background:white;padding:24px;border-radius:14px;box-shadow:0 3px 15px #19324c15}.pill{display:inline-block;background:#e6f7fc;padding:8px 12px;border-radius:20px;margin:5px}footer{text-align:center;padding:30px;color:#65798b;font-size:13px}</style></head><body><header><h1>SEI | Biblioteca Digital</h1><p>Sistema de Ensino Incentivo · São Miguel do Guamá — PA</p></header><main class="wrap"><nav class="crumb" id="crumb"></nav><h2 id="title">Escolha o agrupamento de ensino</h2><section id="content" class="grid"></section></main><footer>AQUI SE FAZ EDUCAÇÃO COM QUALIDADE</footer><script>
const groups=[{name:"Fundamental I",years:["1º ano","2º ano","3º ano","4º ano","5º ano"],subjects:["Língua Portuguesa","Matemática","Ciências","História","Geografia","Arte","Educação Física","Ensino Religioso","Inglês"],color:"#fff0bd"},{name:"Fundamental II",years:["6º ano","7º ano","8º ano","9º ano"],subjects:["Língua Portuguesa","Matemática","Ciências","História","Geografia","Inglês","Arte","Educação Física","Ensino Religioso"],color:"#daf3fb"},{name:"Ensino Médio",years:["1º ano","2º ano"],subjects:["Língua Portuguesa","Literatura","Redação","Matemática","Física","Química","Biologia","História","Geografia","Filosofia","Sociologia","Inglês","Arte","Educação Física"],color:"#e8e5ff"},{name:"Convênio",years:["3º ano"],subjects:["Língua Portuguesa","Literatura","Redação","Matemática","Física","Química","Biologia","História","Geografia","Filosofia","Sociologia","Inglês","Arte","Educação Física"],color:"#dff2de"},{name:"Pré-vestibular",years:["Pré-vestibular"],subjects:["Português","Literatura","Redação","Matemática","Física","Química","Biologia","História","Geografia","Filosofia","Sociologia","Inglês"],color:"#ffe5d6"}];
let g=null,y=null,s=null;const content=document.querySelector("#content"),title=document.querySelector("#title"),crumb=document.querySelector("#crumb");function note(label,desc,color,fn){const b=document.createElement("button");b.className="note";b.style.background=color;b.innerHTML="<span>▧ SEI</span><strong></strong><span></span>";b.children[1].textContent=label;b.children[2].textContent=desc;b.onclick=fn;content.append(b)}function nav(){crumb.innerHTML="";const home=document.createElement("button");home.textContent="Início";home.onclick=()=>{g=y=s=null;render()};crumb.append(home);if(g!==null){const a=document.createElement("button");a.textContent=groups[g].name;a.onclick=()=>{y=s=null;render()};crumb.append(" › ",a)}if(y!==null){const a=document.createElement("button");a.textContent=y;a.onclick=()=>{s=null;render()};crumb.append(" › ",a)}if(s!==null)crumb.append(" › "+s)}function render(){nav();content.innerHTML="";content.className="grid";if(g===null){title.textContent="Escolha o agrupamento de ensino";groups.forEach((x,i)=>note(x.name,x.years.join(" · "),x.color,()=>{g=i;render()}))}else if(y===null){title.textContent="Escolha a série";groups[g].years.forEach(x=>note(x,"Selecionar série",groups[g].color,()=>{y=x;render()}))}else if(s===null){title.textContent="Escolha a disciplina";groups[g].subjects.forEach((x,i)=>note(x,"Selecionar disciplina",["#fff0bd","#daf3fb","#e8e5ff","#dff2de"][i%4],()=>{s=x;render()}))}else{title.textContent=s;content.className="panel";content.innerHTML="<h3></h3><p>Aluno(a): __________________________</p><p>Professor(a): _______________________</p><p>Turma: ______ Data: ____/____/______</p><p>Atividade: _________________________</p><p><strong>Documentos:</strong> a vinculação dos arquivos Word e PDF está em preparação. Esta página já permite testar a navegação.</p>";content.querySelector("h3").textContent=groups[g].name+" • "+y+" • "+s}}render();
</script>
<style>
.demohead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center}.tag{background:#dcf4fa;color:#086c83;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700}.preview{margin-top:18px;border:1px solid #d9e4ed;background:linear-gradient(140deg,#fff,#f2f8fd);border-radius:16px;padding:20px;overflow:hidden}.preview h3{margin-top:0}.demo-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.demo-actions button{border:0;background:#102d55;color:white;padding:13px 16px;border-radius:9px;font-weight:700;cursor:pointer}.demo-actions button.secondary{background:#e6f7fc;color:#102d55}.scene{height:190px;display:flex;align-items:center;justify-content:center;perspective:650px;cursor:pointer;touch-action:pan-y}.cube{position:relative;width:105px;height:105px;transform-style:preserve-3d;transform:rotateX(-23deg) rotateY(-32deg);transition:transform .6s}.cube.turn{transform:rotateX(-23deg) rotateY(145deg)}.face{position:absolute;width:105px;height:105px;background:#43c4e9a8;border:2px solid #0879a4;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;color:#0c3755}.front{transform:translateZ(52.5px)}.back{transform:rotateY(180deg) translateZ(52.5px)}.right{transform:rotateY(90deg) translateZ(52.5px)}.left{transform:rotateY(-90deg) translateZ(52.5px)}.top{transform:rotateX(90deg) translateZ(52.5px)}.bottom{transform:rotateX(-90deg) translateZ(52.5px)}.chart3d{display:flex;align-items:flex-end;justify-content:center;gap:26px;height:205px;padding:20px 0 0;perspective:600px}.bar3d{position:relative;width:55px;background:#36a9df;transform:skewY(-7deg);box-shadow:12px -10px 0 #1777a4;display:flex;align-items:flex-end;justify-content:center;color:white;font-weight:700;padding-bottom:8px}.bar3d small{position:absolute;bottom:-26px;color:#183450;font-size:12px}.question{padding:12px 0;border-bottom:1px solid #e1e9f0;line-height:1.55}.tip{color:#61788e;font-size:13px}.paper{background:white;border:1px solid #d6e1e9;padding:22px;max-width:760px;margin:14px auto;box-shadow:0 5px 15px #18345012}.paper-header{border-bottom:2px solid #0e789e;padding-bottom:12px;margin-bottom:16px}.paper-header strong{display:block;font-size:17px;color:#102d55}@media print{body>*:not(#print-area){display:none!important}#print-area{display:block!important}.paper{border:0;box-shadow:none;max-width:none;margin:0;padding:0}@page{size:A4;margin:15mm}}#print-area{display:none}
</style>
<script>
const demoTopics={
"Matemática":["Geometria espacial","Observe o cubo tridimensional. Quantas faces, arestas e vértices ele possui?","Calcule o volume de um cubo cuja aresta mede 3 cm."],
"Física":["Grandezas e movimento","Observe o gráfico demonstrativo de deslocamento.","Compare os valores representados e explique a variação."],
"Química":["Estrutura da matéria","Observe o modelo geométrico tridimensional.","Identifique as formas e discuta como modelos representam partículas."],
"Biologia":["Estruturas e formas na natureza","Observe o modelo tridimensional demonstrativo.","Explique por que os modelos ajudam a estudar estruturas biológicas."],
"Ciências":["Formas e observação científica","Observe o sólido tridimensional.","Descreva suas faces e proponha um objeto cotidiano com forma semelhante."],
"Geografia":["Leitura de dados regionais","Analise o gráfico ilustrativo de três localidades.","Qual localidade apresenta o maior valor? Qual apresenta o menor?"],
"História":["Linha do tempo","Organize três acontecimentos históricos estudados em ordem cronológica.","Explique a importância de identificar causas e consequências."],
"Língua Portuguesa":["Leitura e interpretação","Leia: 'O conhecimento cresce quando fazemos perguntas e buscamos respostas.'","Qual é a ideia central da frase? Reescreva-a com suas palavras."],
"Português":["Interpretação textual","Leia: 'A leitura abre caminhos para novas descobertas.'","Identifique a mensagem principal e escreva um parágrafo sobre ela."],
"Literatura":["Linguagem literária","Leia: 'A manhã vestiu a cidade de luz.'","Identifique o recurso expressivo presente na frase."],
"Redação":["Produção textual","Tema: A importância da educação na comunidade.","Escreva um texto com introdução, desenvolvimento e conclusão."],
"Inglês":["Vocabulary","Read: 'The student reads a book at school.'","Translate the sentence and identify the verb."],
"Arte":["Formas e composição","Observe a composição geométrica tridimensional.","Crie uma composição própria utilizando formas e cores."],
"Educação Física":["Movimento e saúde","Considere três atividades físicas praticadas na escola.","Explique dois benefícios da prática regular de exercícios."],
"Ensino Religioso":["Convivência e respeito","Leia: 'O diálogo permite compreender diferentes perspectivas.'","Cite duas atitudes que favorecem o respeito."],
"Filosofia":["Pensamento crítico","Reflita sobre a pergunta: o que significa conhecer?","Apresente um argumento e um exemplo."],
"Sociologia":["Vida em sociedade","Observe situações de cooperação na comunidade escolar.","Explique como regras e valores influenciam a convivência."]
};
function topicFor(name){return demoTopics[name]||demoTopics["Língua Portuguesa"]}
function shapeType(name){return ["Matemática","Ciências","Biologia","Química","Arte"].includes(name)?"solid":["Geografia","Física"].includes(name)?"chart":"text"}
function visual(type){if(type==="solid")return '<div class="scene" title="Toque para girar o modelo"><div class="cube" id="cube">'+["front","back","right","left","top","bottom"].map((f,i)=>'<div class="face '+f+'">'+(i+1)+'</div>').join("")+'</div></div><p class="tip">Modelo tridimensional demonstrativo • toque no sólido para girar</p>';if(type==="chart")return '<div class="chart3d"><div class="bar3d" style="height:72px">12<small>A</small></div><div class="bar3d" style="height:135px">24<small>B</small></div><div class="bar3d" style="height:105px">18<small>C</small></div></div><p class="tip">Gráfico 3D ilustrativo, com valores fictícios para demonstração.</p>';return ''}
function paperMarkup(){const t=topicFor(s);return '<article class="paper"><div class="paper-header"><strong>SISTEMA DE ENSINO INCENTIVO — SEI</strong><span>Atividade demonstrativa • '+groups[g].name+' • '+y+' • '+s+'</span></div><p>Aluno(a): __________________________________________</p><p>Professor(a): ________________________________________</p><p>Turma: __________ Data: ____/____/______</p><h3>'+t[0]+'</h3><p class="question"><b>1.</b> '+t[1]+'</p><p class="question"><b>2.</b> '+t[2]+'</p><p><b>Resposta:</b> __________________________________________________</p><p>________________________________________________________________</p><p>________________________________________________________________</p></article>'}
function wordDownload(){const doc='<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Arial;margin:45px;color:#16324f}h3{color:#0879a4}</style></head><body>'+paperMarkup()+'</body></html>';const blob=new Blob(['\ufeff',doc],{type:'application/msword'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SEI_'+s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_')+'_'+y.replace(/[^0-9]/g,'')+'.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const originalRender=render;render=function(){originalRender();if(s===null)return;const t=topicFor(s),type=shapeType(s);content.innerHTML='<div class="demohead"><span class="tag">CONTEÚDO DE TESTE</span><span class="tip">'+groups[g].name+' · '+y+'</span></div><div class="preview"><h3>'+t[0]+'</h3>'+visual(type)+'<div class="question"><b>Questão 1.</b> '+t[1]+'</div><div class="question"><b>Questão 2.</b> '+t[2]+'</div></div><div class="demo-actions"><button id="previewprint">Visualizar / salvar PDF</button><button class="secondary" id="word">Baixar Word editável (.doc)</button></div><p class="tip">Prévia de teste. O PDF é gerado pela opção Imprimir/Salvar como PDF do navegador. O Word é um arquivo .doc compatível, não .docx. Os modelos 3D são interativos apenas na página.</p>';content.querySelector('#previewprint').onclick=()=>{document.querySelector('#print-area').innerHTML=paperMarkup();window.print()};content.querySelector('#word').onclick=wordDownload;const cube=content.querySelector('#cube');if(cube)cube.onclick=()=>cube.classList.toggle('turn')};document.body.insertAdjacentHTML('beforeend','<div id="print-area"></div>');render();
</script></body></html>
