<style>
@font-face{font-family:SeiRubik;src:url(assets/fonts/Rubik-ExtraBold.ttf)}@font-face{font-family:SeiPoppins;src:url(assets/fonts/Poppins-Bold.ttf)}
.lt-turma{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(11,42,91,.10);border-left:6px solid var(--c,#1e4fb8);display:flex;flex-direction:column;gap:8px}
.lt-turma textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;min-height:170px;width:100%}
.ct-prev{display:flex;flex-direction:column;gap:14px}
.ct-cv{width:100%;max-width:760px;height:auto;box-shadow:0 6px 20px rgba(0,0,0,.25);border-radius:4px}
.ct-meds{display:flex;gap:12px;flex-wrap:wrap}
/* certificado (A4 deitada, em mm) */
.ct-art{position:relative;width:297mm;height:210mm;font-family:SeiPoppins,Arial,sans-serif;color:#0b1a4a;overflow:hidden}
.ct-art *{box-sizing:border-box}
.ca-moldura{position:absolute;inset:0}
.ca-folha{position:absolute;left:6mm;top:6mm;width:285mm;height:198mm;background:linear-gradient(180deg,#fffefe,#f2f8ff);border-radius:6mm;overflow:hidden}
.ca-risc{position:absolute;inset:0}
.ca-topo{position:absolute;left:10mm;right:10mm;top:7mm;display:flex;align-items:center;gap:3mm;color:#0b2a6b}
.ca-topo img{height:19mm}.ca-topo div{flex:1;display:flex;flex-direction:column;line-height:1.25}.ca-topo b{font-size:5mm}.ca-topo small{font-size:3.4mm;color:#55627e}
.ca-chip{color:#fff;font-family:SeiRubik,Arial Black,sans-serif;font-size:4.6mm;padding:1.6mm 4.5mm;border-radius:99mm;white-space:nowrap}
.ca-tit{position:absolute;left:0;right:0;top:25mm;text-align:center;font-family:SeiRubik,Arial Black,sans-serif;font-size:21mm;line-height:1;color:#140a52;letter-spacing:1.2mm;text-shadow:0 1.2mm 0 #ff2bd6,0 0 4mm rgba(0,217,255,.55)}
.ca-tipo{position:absolute;left:50%;transform:translateX(-50%);top:51mm;color:#fff;font-family:SeiRubik,Arial Black,sans-serif;font-size:7mm;padding:2mm 7mm;border-radius:99mm;white-space:nowrap;box-shadow:0 1.2mm 3mm rgba(0,0,0,.2)}
.ca-para{position:absolute;left:0;right:0;top:71mm;height:8mm;line-height:8mm;text-align:center;font-size:4.4mm;font-weight:700;color:#0b2a6b}
.ca-nome{position:absolute;left:24mm;right:24mm;top:79mm;height:22mm;display:flex;align-items:center;justify-content:center;font-family:SeiRubik,Arial Black,sans-serif;color:#0b1a4a;white-space:nowrap;line-height:1}
.ca-nome span{padding:0 2mm}
.ca-msg{position:absolute;left:24mm;right:24mm;top:103mm;margin:0;text-align:center;font-size:5.2mm;line-height:8.2mm;color:#24324f}
.ca-palco{position:absolute;left:6mm;bottom:7mm;width:74mm;height:70mm}
.ca-luz{position:absolute;left:4mm;right:4mm;bottom:6mm;height:40mm;border-radius:50%}
.ca-masc{position:absolute;left:50%;transform:translateX(-50%);bottom:10mm;height:54mm}
.ca-podio{position:absolute;left:2mm;right:2mm;bottom:0;display:flex;align-items:flex-end;gap:1mm}
.ca-podio span{flex:1;display:flex;justify-content:center;align-items:flex-start;padding-top:1.4mm;border-radius:2mm 2mm 0 0;font-family:SeiRubik,Arial Black,sans-serif;font-size:4.6mm;color:#fff;box-shadow:0 0 2.5mm rgba(0,0,0,.18)}
.ca-podio .d{height:12mm;background:linear-gradient(180deg,#8ff8ff,#00a7c4)}.ca-podio .um{flex:1.3;height:19mm;background:linear-gradient(180deg,#fff35c,#ffb400);color:#4a3200}.ca-podio .t{height:9mm;background:linear-gradient(180deg,#ff9be8,#d61fb0)}
.ca-balao{position:absolute;left:50mm;top:9mm;background:#fff;border:.8mm solid;border-radius:5mm 5mm 5mm 1mm;font-size:4mm;line-height:1.2;padding:2mm 3.5mm;text-align:center;font-weight:700;color:#0b1a4a;box-shadow:0 1mm 3mm rgba(0,0,0,.15);white-space:nowrap}
.ca-data{position:absolute;left:84mm;right:80mm;bottom:42mm;white-space:nowrap;font-size:4mm!important;text-align:center;font-size:4.2mm;font-weight:700;color:#0b2a6b}
.ca-ass{position:absolute;left:96mm;right:82mm;bottom:20mm;display:flex;gap:12mm}
.ca-ass div{flex:1;text-align:center;font-size:4.4mm;font-weight:700;color:#0b2a6b}.ca-ass i{display:block;border-top:.5mm solid #0b2a6b;margin-bottom:1.5mm}
.ca-conf{position:absolute;inset:0;pointer-events:none}.ca-conf i{position:absolute;border-radius:.4mm;opacity:.85}
.ca-tit i{font-style:normal;color:#ffd600;font-size:.55em;vertical-align:.35em;margin:0 4mm;text-shadow:0 0 2mm #ff2bd6}
.ca-selo{position:absolute;right:12mm;bottom:12mm;height:60mm;filter:drop-shadow(0 1mm 2mm rgba(0,0,0,.25))}
.ca-rod{position:absolute;left:0;right:0;bottom:3mm;text-align:center;font-size:3.3mm;color:#55627e}
/* medalha (60 mm) */
.md-art{width:60mm;height:60mm;font-family:SeiPoppins,Arial,sans-serif}
.md-anel{width:60mm;height:60mm;border-radius:50%;padding:2.2mm;box-sizing:border-box}
.md-disco{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2a1a8a 0,#140a52 60%,#06031f 100%)}
.md-risc{position:absolute;inset:0}
.md-logo{position:absolute;left:50%;top:3.5mm;transform:translateX(-50%);height:10mm;background:#fff;border-radius:1.5mm;padding:.6mm}
.md-grande{position:absolute;left:0;right:0;top:16mm;text-align:center;font-family:SeiRubik,Arial Black,sans-serif;line-height:1.1}
.md-fita{position:absolute;left:6mm;right:6mm;top:29.5mm;text-align:center;color:#fff;font-family:SeiRubik,Arial Black,sans-serif;font-size:3.4mm;padding:1mm 0;border-radius:99mm}
.md-masc{position:absolute;left:50%;bottom:-1mm;transform:translateX(-45%);height:20mm}
.md-estrela{position:absolute;left:8mm;bottom:9mm;font-size:6.5mm}.md-estrela.b{left:auto;right:7mm;bottom:7mm;font-size:5.5mm}
.pr-nav{display:flex;gap:6px;max-width:1100px;margin:14px auto 0;padding:0 16px;flex-wrap:wrap}
.pr-nav a{font:700 15px system-ui,Arial;border-radius:12px 12px 0 0;padding:10px 16px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none}
.pr-nav a.on{background:#fff;color:#0b2a5b}
</style>
