<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>
@font-face{font-family:SeiRubik;src:url(assets/fonts/Rubik-ExtraBold.ttf)}@font-face{font-family:SeiPoppins;src:url(assets/fonts/Poppins-Bold.ttf)}
.lt-turma{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(11,42,91,.10);border-left:6px solid var(--c,#1e4fb8);display:flex;flex-direction:column;gap:8px}
.lt-turma textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;min-height:170px;width:100%}
.ct-prev{display:flex;flex-direction:column;gap:14px}
.ct-cv{width:100%;max-width:760px;height:auto;box-shadow:0 6px 20px rgba(0,0,0,.25);border-radius:4px}
.ct-meds{display:flex;gap:12px;flex-wrap:wrap}
/* certificado (A4 deitada, em mm) */
.ct-art{position:relative;width:297mm;height:210mm;font-family:SeiPoppins,Arial,sans-serif;color:#fff;overflow:hidden;background:#0a2a8a}
.ct-art *{box-sizing:border-box}
.ca-bg{position:absolute;inset:0;background:url(assets/portal/fundo-etapas.jpg?v=4) center/cover no-repeat}
.ca-vinheta{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(40,130,255,.35) 0,rgba(10,40,140,0) 45%,rgba(3,14,60,.55) 100%)}
.ca-linha{position:absolute;left:7mm;top:7mm;right:7mm;bottom:7mm;border:.5mm solid rgba(125,249,255,.55);border-radius:5mm;box-shadow:0 0 3mm rgba(0,217,255,.35),inset 0 0 3mm rgba(0,217,255,.25)}
.ca-linha::after{content:"";position:absolute;inset:1.6mm;border:.25mm solid rgba(255,230,0,.45);border-radius:3.8mm}
.ca-logo{position:absolute;left:50%;top:9mm;transform:translateX(-50%);height:40mm;filter:drop-shadow(0 0 3mm rgba(125,249,255,.75)) drop-shadow(0 1.5mm 2mm rgba(0,0,0,.45))}
.ca-chip{position:absolute;right:14mm;top:13mm;font-family:SeiRubik,Arial Black,sans-serif;font-size:4.4mm;padding:1.6mm 4.5mm;border-radius:99mm;white-space:nowrap;box-shadow:0 0 3mm rgba(255,214,0,.6)}
.ca-insta{position:absolute;left:14mm;top:14.5mm;font-family:SeiRubik,Arial Black,sans-serif;font-size:4.2mm;color:#7df9ff;text-shadow:0 0 2mm rgba(0,217,255,.8)}
.ca-tit{position:absolute;left:0;right:0;top:50mm;text-align:center;font-family:SeiRubik,Arial Black,sans-serif;font-size:19mm;line-height:1;color:#ffe600;letter-spacing:1.2mm;text-shadow:0 0 1.5mm #ffe600,0 0 5mm rgba(255,200,0,.7),0 1.2mm 0 #0a2a8a}
.ca-tit i{font-style:normal;color:#7df9ff;font-size:.5em;vertical-align:.35em;margin:0 4mm;text-shadow:0 0 2mm #00d9ff}
.ca-tipo{position:absolute;left:50%;transform:translateX(-50%);top:72mm;font-family:SeiRubik,Arial Black,sans-serif;font-size:6.4mm;padding:1.6mm 7mm;border-radius:99mm;white-space:nowrap;box-shadow:0 0 3mm rgba(255,214,0,.45),0 1.2mm 3mm rgba(0,0,0,.3)}
.ca-para{position:absolute;left:0;right:0;top:86mm;height:8mm;line-height:8mm;text-align:center;font-size:4.4mm;font-weight:700;color:#7df9ff}
.ca-nome{position:absolute;left:30mm;right:30mm;top:94mm;height:22mm;display:flex;align-items:center;justify-content:center;font-family:SeiRubik,Arial Black,sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(90deg,rgba(0,217,255,.08),rgba(0,217,255,.2),rgba(0,217,255,.08));border:.7mm solid #00d9ff;border-radius:11mm;box-shadow:0 0 4mm rgba(0,217,255,.6),inset 0 0 4mm rgba(0,217,255,.35)}
.ca-nome span{display:block;line-height:1;padding:.12em 2mm 0;text-shadow:0 0 2.5mm rgba(0,217,255,.9)}
.ca-msg{position:absolute;left:30mm;right:30mm;top:119mm;margin:0;text-align:center;font-size:5mm;line-height:8.2mm;color:#eaf2ff}
.ca-palco{position:absolute;left:12mm;bottom:9mm;width:66mm;height:62mm}
.ca-luz{position:absolute;left:4mm;right:4mm;bottom:6mm;height:38mm;border-radius:50%}
.ca-masc{position:absolute;left:50%;transform:translateX(-50%);bottom:9mm;height:48mm}
.ca-podio{position:absolute;left:2mm;right:2mm;bottom:0;display:flex;align-items:flex-end;gap:1mm}
.ca-podio span{flex:1;display:flex;justify-content:center;align-items:flex-start;padding-top:1.3mm;border-radius:2mm 2mm 0 0;font-family:SeiRubik,Arial Black,sans-serif;font-size:4.2mm;color:#fff;box-shadow:0 0 2.5mm rgba(0,217,255,.35)}
.ca-podio .d{height:11mm;background:linear-gradient(180deg,#8ff8ff,#00a7c4)}.ca-podio .um{flex:1.3;height:17mm;background:linear-gradient(180deg,#fff35c,#ffb400);color:#4a3200}.ca-podio .t{height:8mm;background:linear-gradient(180deg,#8fb8ff,#1e6bff)}
.ca-balao{position:absolute;left:47mm;top:2mm;background:#fff;color:#0b1a4a;border:.8mm solid #ffd600;border-radius:5mm 5mm 5mm 1mm;font-size:3.8mm;line-height:1.2;padding:2mm 3.5mm;text-align:center;font-weight:700;box-shadow:0 0 3mm rgba(255,214,0,.5);white-space:nowrap}
.ca-data{position:absolute;left:90mm;right:90mm;bottom:38mm;white-space:nowrap;text-align:center;font-size:4mm;font-weight:700;color:#eaf2ff}
.ca-ass{position:absolute;left:98mm;right:98mm;bottom:15mm;display:flex;gap:12mm}
.ca-ass div{flex:1;text-align:center;font-size:4.2mm;font-weight:700;color:#7df9ff}.ca-ass i{display:block;border-top:.5mm solid #ffffff;margin-bottom:1.5mm}
.ca-um{position:absolute;right:18mm;bottom:10mm;width:48mm;height:64mm}
.ca-um img{position:absolute;left:0;top:0;width:48mm;height:64mm;filter:drop-shadow(0 1.5mm 2.5mm rgba(0,0,0,.45))}
.ca-fita{position:absolute;left:-7mm;right:-7mm;top:34mm;text-align:center;font-family:SeiRubik,Arial Black,sans-serif;font-size:4.2mm;color:#0b1a4a;background:linear-gradient(90deg,#ffd600,#fff35c,#ffd600);border-radius:1.5mm;padding:1.2mm 0;transform:rotate(-6deg);box-shadow:0 1mm 2mm rgba(0,0,0,.35)}
.ca-honra{position:absolute;left:-10mm;right:-10mm;top:-7mm;text-align:center;font-family:SeiRubik,Arial Black,sans-serif;font-size:4mm;color:#7df9ff;letter-spacing:.4mm;text-shadow:0 0 2mm rgba(0,217,255,.9)}
.ca-conf{position:absolute;inset:0;pointer-events:none}.ca-conf i{position:absolute;border-radius:.4mm;opacity:.85}
/* medalha (60 mm) */
.md-art{width:60mm;height:60mm;font-family:SeiPoppins,Arial,sans-serif}
.md-anel{width:60mm;height:60mm;border-radius:50%;padding:2.2mm;box-sizing:border-box}
.md-disco{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#1846b8 0,#0b2a6b 60%,#061650 100%)}
.md-risc{position:absolute;inset:0}
.md-logo{position:absolute;left:50%;top:3.5mm;transform:translateX(-50%);height:10mm;background:#fff;border-radius:1.5mm;padding:.6mm}
.md-grande{position:absolute;left:0;right:0;top:16mm;text-align:center;font-family:SeiRubik,Arial Black,sans-serif;line-height:1.1}
.md-fita{position:absolute;left:6mm;right:6mm;top:29.5mm;text-align:center;color:#fff;font-family:SeiRubik,Arial Black,sans-serif;font-size:3.4mm;padding:1mm 0;border-radius:99mm}
.md-masc{position:absolute;left:50%;bottom:-1mm;transform:translateX(-45%);height:20mm}
.md-estrela{position:absolute;left:8mm;bottom:9mm;font-size:6.5mm}.md-estrela.b{left:auto;right:7mm;bottom:7mm;font-size:5.5mm}
.pr-nav{display:flex;gap:6px;max-width:1100px;margin:14px auto 0;padding:0 16px;flex-wrap:wrap}
.pr-nav a{font:700 15px system-ui,Arial;border-radius:12px 12px 0 0;padding:10px 16px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none}
.pr-nav a.on{background:#fff;color:#0b2a5b}
</style>
