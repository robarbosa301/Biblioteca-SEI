<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listão dos Aprovados · SEI</title>
<link rel="manifest" href="manifest.webmanifest">

<meta name="description" content="Monte o painel dos aprovados da escola em várias folhas A4.">
<link rel="icon" type="image/png" href="favicon.png?v=2"><link rel="apple-touch-icon" href="assets/portal/apple-touch-icon.png?v=2">
<style>
@font-face{font-family:SeiRubik;src:url(assets/fonts/Rubik-ExtraBold.ttf)}@font-face{font-family:SeiPoppins;src:url(assets/fonts/Poppins-Bold.ttf)}
.lt-turmas{display:flex;flex-direction:column;gap:12px}
.lt-turma{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(11,42,91,.10);border-left:6px solid var(--c,#1e4fb8);display:flex;flex-direction:column;gap:8px}
.lt-turma .es-linha select,.lt-turma .es-linha input{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:9px}
.lt-turma textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;min-height:130px;width:100%}
.lt-prev{background:#0b2a5b;border-radius:14px;padding:12px;overflow:auto;text-align:center}
.lt-prev canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.lt-prev p{color:#dfeaff;margin:8px 0 0;font-size:14px}
/* o cartaz (desenhado em milímetros) — estilo post, cores neon */
.cz{position:relative;overflow:hidden;font-family:SeiPoppins,Arial,sans-serif;color:#0b1a4a;box-sizing:border-box;display:flex;flex-direction:column}
.cz.festa{background:radial-gradient(circle at 15% 12%,rgba(255,43,214,.45) 0,rgba(255,43,214,0) 28%),radial-gradient(circle at 88% 20%,rgba(0,229,255,.4) 0,rgba(0,229,255,0) 30%),radial-gradient(circle at 50% 80%,rgba(157,92,255,.35) 0,rgba(157,92,255,0) 45%),linear-gradient(180deg,#140a52 0,#0b0638 55%,#06031f 100%)}
.cz.leve{background:#fff}
.cz.leve .cz-luz{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,43,214,.05) 0 2%,rgba(0,217,255,.05) 2% 4%)}
.cz-conf{position:absolute;inset:0;pointer-events:none}
.cz-cab{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
.cz.leve .cz-cab{background:radial-gradient(circle at 15% 20%,rgba(255,43,214,.45) 0,rgba(255,43,214,0) 35%),radial-gradient(circle at 90% 30%,rgba(0,229,255,.4) 0,rgba(0,229,255,0) 35%),linear-gradient(135deg,#140a52,#06031f);border-bottom:solid #ff2bd6}
.cz-cab img.m{flex:0 0 auto}
.cz-masc{position:relative;flex:0 0 auto}.cz-masc img{position:absolute;left:0;bottom:0}
.cz-balao{position:absolute;background:#fff;color:#0b1a4a;border:solid #ff2bd6;border-radius:1em 1em 1em .2em;font-family:SeiPoppins,Arial,sans-serif;line-height:1.2;text-align:center;box-shadow:0 0 .6em rgba(255,43,214,.8)}
.cz-tit{text-align:center;line-height:1;display:flex;flex-direction:column;align-items:center}
.cz-tit .cz-grande{display:block;font-family:SeiRubik,Arial Black,sans-serif;color:#fff200;text-shadow:0 0 .06em #fff200,0 0 .18em #ff2bd6,0 .06em 0 #ff2bd6;letter-spacing:.01em}
.cz-chama{display:inline-block;color:#7df9ff;border:solid #00e5ff;border-radius:99em;font-family:SeiRubik,Arial Black,sans-serif;text-shadow:0 0 .3em #00e5ff;box-shadow:0 0 .5em rgba(0,229,255,.7)}
.cz-pill{display:inline-block;font-style:normal;background:#ff2bd6;color:#fff;border-radius:99em;font-family:SeiRubik,Arial Black,sans-serif;padding:.08em .7em;box-shadow:0 0 .5em #ff2bd6}
.cz-pill.t{background:#00d9ff;color:#06031f;box-shadow:0 0 .5em #00d9ff}
.cz-sub{display:block;color:#fff}
.cz-conta{display:block;color:#b8ff7a}.cz-conta em,.cz-rod em{font-style:normal;background:#ff2bd6;color:#fff;border-radius:99em;padding:0 .45em}
.cz-corpo{position:relative;flex:1 1 auto;overflow:hidden;padding:0 .6%}
.cz-bloco{position:relative;color:#0b1a4a;border-radius:.25em;box-shadow:0 .35em .9em rgba(0,0,0,.45)}
.cz.leve .cz-bloco{box-shadow:0 .25em .6em rgba(11,26,74,.25)}
.cz-fita{position:absolute;left:50%;top:-.45em;width:4.5em;height:1.1em;margin-left:-2.25em;background:rgba(255,255,255,.6);transform:rotate(-3deg);box-shadow:0 .05em .2em rgba(0,0,0,.15)}
.cz-bloco h3{margin:0;font-family:SeiRubik,Arial Black,sans-serif;font-weight:800;text-align:center;line-height:1.1;color:#0b1a4a}
.cz-grito{margin:0 0 .3em;text-align:center;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden}
.cz-bloco ol{margin:0;list-style:none;line-height:1.28}
.cz-bloco li{white-space:nowrap;overflow:hidden}
.cz-bloco li::before{content:"✦ ";color:#ff2bd6}
.cz-bloco .dez{display:inline-block;margin-left:.35em;background:#ff2bd6;color:#fff;font-size:.68em;border-radius:99em;padding:.02em .45em;vertical-align:.12em;font-family:SeiRubik,Arial Black,sans-serif}
.cz-rod{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;text-align:center}
.cz.festa .cz-rod{color:#d9e6ff}.cz.leve .cz-rod{color:#140a52}
</style>
</head>

<footer class="no-print"><p>O rascunho fica guardado <b>neste aparelho</b>. Imprima sempre em <b>tamanho real (100%)</b>, depois corte nas marcas e monte o painel seguindo o número de cada folha.</p></footer>

</body>
</html>
